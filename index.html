                for(let i=0;i<snowflakes.length;i++){ const s=snowflakes[i]; s.y+=s.speed; s.x+=Math.sin(s.phase+s.y*s.wobble)*1.5; s.phase+=0.03; if(s.y>canvas.height+30){ s.y=-30; s.x=Math.random()*canvas.width; } drawSnowflake(s); }
                for(let i=0;i<flowers.length;i++){ const f=flowers[i]; f.y+=f.speed; f.x+=Math.cos(f.phase+f.y*f.wobble)*1.5; f.phase+=0.03; f.hue=(f.hue+0.5)%360; if(f.y>canvas.height+30){ f.y=-30; f.x=Math.random()*canvas.width; } drawFlower(f); }
                for(let i=0;i<snowmen.length;i++){ const sm=snowmen[i]; sm.y+=sm.speed; sm.x+=Math.sin(sm.phase+sm.y*sm.wobble)*1.2; sm.phase+=0.03; if(sm.y>canvas.height+50){ sm.y=-50; sm.x=Math.random()*canvas.width; } drawSnowman(sm); }
                for(let i=0;i<stars.length;i++){ const s=stars[i]; s.y+=s.speed; s.x+=Math.sin(s.phase+s.y*0.01)*0.5; if(s.y>canvas.height+10){ s.y=-10; s.x=Math.random()*canvas.width; } drawStar(s); }
                // Thêm hiệu ứng nổ
                for(let i=0;i<200;i++){ ctx.beginPath(); let x=Math.random()*canvas.width; let y=Math.random()*canvas.height; ctx.moveTo(x,y); for(let j=0;j<20;j++){ x+=(Math.random()-0.5)*80; y+=(Math.random()-0.5)*80; ctx.lineTo(x,y); } ctx.strokeStyle=`hsla(${Math.random()*360},100%,70%,${Math.random()*0.2+0.05})`; ctx.lineWidth=Math.random()*3+1; ctx.stroke(); }
                for(let i=0;i<400;i++){ const cx=Math.sin(Date.now()/200+i)*canvas.width*0.45+canvas.width/2; const cy=Math.cos(Date.now()/150+i*1.5)*canvas.height*0.45+canvas.height/2; const r=30+Math.sin(Date.now()/100+i*0.5)*25; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=`hsla(${i*2+Date.now()/20},100%,60%,${Math.random()*0.05+0.02})`; ctx.fill(); ctx.strokeStyle=`hsla(${i*3+Date.now()/30},100%,70%,${Math.random()*0.05+0.02})`; ctx.lineWidth=3; ctx.stroke(); }
            } else {
                ctx.fillStyle = 'rgba(0,0,0,0.02)';
                ctx.fillRect(0,0,canvas.width,canvas.height);
                if (kicked) {
                    ctx.fillStyle = 'rgba(255,0,64,0.15)';
                    ctx.font = '40px Arial';
                    ctx.fillText('🚫 ĐÃ BỊ KICK', canvas.width/2 - 130, canvas.height/2);
                }
            }
            if (!kicked || !canExit) {
                requestAnimationFrame(drawAll);
            }
        }
        drawAll();

        console.log('🔒 APP KHÓA CỨNG - KHÔNG THỂ THOÁT - CHUYỂN 50K MỚI RA');
    })();
</script>
